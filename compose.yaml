services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nightwood
      POSTGRES_PASSWORD: nightwood_local_only
      POSTGRES_DB: nightwood
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - nightwood-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nightwood -d nightwood"]
      interval: 2s
      timeout: 3s
      retries: 30
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  nightwood-db:
